name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tests

      - name: Install from this checkout
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/install.sh
          HANDOVER_SOURCE_DIR="$PWD" bash scripts/install.sh --no-setup
          ~/.local/bin/handover --version
          HANDOVER_HOME="$RUNNER_TEMP/h" ~/.local/bin/handover host --agent ci --no-service --no-claude --no-codex
          HANDOVER_HOME="$RUNNER_TEMP/h" ~/.local/bin/handover link
      - name: Uninstall
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/uninstall.sh
          HANDOVER_HOME="$RUNNER_TEMP/h" bash scripts/uninstall.sh
          for p in ~/.local/bin/handover ~/.local/share/handover "$RUNNER_TEMP/h"; do
            if [ -e "$p" ]; then echo "left behind: $p"; exit 1; fi
          done

      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($f in 'scripts/install.ps1', 'scripts/uninstall.ps1', 'scripts/build-windows.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors; exit 1 }
          }
      - name: Build Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Install the built release (Windows PowerShell 5.1, as on a stock Windows 11)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:HANDOVER_RELEASE_DIR = Resolve-Path dist
          $env:HANDOVER_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'handover-install'
          $env:HANDOVER_HOME = Join-Path $env:RUNNER_TEMP 'hh'
          $env:HANDOVER_TOKEN = 'ci-shared-secret'
          # A leftover v0.5.0-style task (run through conhost --headless) must be removed, not recreated.
          schtasks /Create /TN handover-relay /SC ONLOGON /TR "conhost.exe --headless cmd /c exit" /F | Out-Null
          & ./scripts/install.ps1 -Host -Agent ci-win
          if ($LASTEXITCODE -ne 0) { throw 'install.ps1 failed' }
          cmd /c "schtasks /Query /TN handover-relay >nul 2>&1"
          if ($LASTEXITCODE -eq 0) { throw 'install.ps1 left the legacy hidden task in place' }
          if ($env:HANDOVER_TOKEN) { throw 'install.ps1 left HANDOVER_TOKEN in the session' }
          if ((Get-Content (Join-Path $env:HANDOVER_HOME 'config.json') -Raw | ConvertFrom-Json).token -ne 'ci-shared-secret') { throw 'setup did not take the token from HANDOVER_TOKEN' }
          $exe = Join-Path $env:HANDOVER_INSTALL_DIR 'app\handover.exe'
          & $exe --version
          & $exe link
          if ($LASTEXITCODE -ne 0) { throw 'handover link failed' }
          & $exe doctor --json | Out-Host
          if ((Get-Content (Join-Path $env:HANDOVER_HOME 'config.json') -Raw | ConvertFrom-Json).role -ne 'host') { throw '-Host did not make a host' }
          # A client on the same machine joins by URL: role client, never a relay.
          $env:HANDOVER_TOKEN = 'ci-shared-secret'
          $clientHome = Join-Path $env:RUNNER_TEMP 'hc'
          $saved = $env:HANDOVER_HOME; $env:HANDOVER_HOME = $clientHome
          & $exe join http://127.0.0.1:7777 --agent ci-client
          if ($LASTEXITCODE -ne 0) { throw 'handover join failed' }
          $client = Get-Content (Join-Path $clientHome 'config.json') -Raw | ConvertFrom-Json
          if ($client.role -ne 'client' -or $client.relay) { throw 'join did not make a client' }
          $env:HANDOVER_HOME = $saved; Remove-Item Env:HANDOVER_TOKEN
      - name: Hand a task over with the compiled exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'handover-install\app\handover.exe'
          $env:HANDOVER_HOME = Join-Path $env:RUNNER_TEMP 'hh'
          # Default on Windows: no logon task; `wait` hosts the relay itself.
          if ((& $exe service status) -ne 'not-installed') { throw 'setup should not install a logon task by default on Windows' }
          # handover logs to stderr; inside a job PowerShell turns that into error records,
          # so send it to a file and keep only the JSON on stdout.
          $err = Join-Path $env:RUNNER_TEMP 'wait.err'
          $wait = Start-Job {
            param($exe, $home_, $err)
            $env:HANDOVER_HOME = $home_
            & $exe wait --objective 'windows ci' --json --timeout 60 2>$err
            "EXIT=$LASTEXITCODE"
          } -ArgumentList $exe, $env:HANDOVER_HOME, $err
          Start-Sleep -Seconds 3
          & $exe worker --once --exec 'findstr /c:"windows ci"'
          $lines = @(Receive-Job $wait -Wait)
          Get-Content $err -ErrorAction SilentlyContinue | Write-Host
          $exit = ($lines | Where-Object { $_ -like 'EXIT=*' }) -replace 'EXIT=', ''
          $json = ($lines | Where-Object { $_ -notlike 'EXIT=*' }) -join "`n"
          Write-Host $json
          if ($exit -ne '0') { throw "wait exited $exit" }
          if (($json | ConvertFrom-Json).status -ne 'success') { throw 'handover did not complete' }
          # Opt-in logon task: visible (no conhost --headless, not hidden), starts the relay, removable.
          & $exe service install
          Start-Sleep -Seconds 3
          if ((& $exe service status) -ne 'running') { & $exe service log; throw 'relay task is not running' }
          $xml = (& schtasks /Query /TN handover-relay /XML) -join "`n"
          if ($xml -match 'conhost|<Hidden>true') { throw 'logon task must not be hidden' }
          # Full removal, leaving a logon task in place for uninstall.ps1 to find.
          & $exe service install
          $env:HANDOVER_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'handover-install'
          # Write-Host goes to the information stream (6), not the pipeline.
          $out = & ./scripts/uninstall.ps1 6>&1 | Out-String
          Write-Host $out
          if ($out -match '\[FAIL\]') { throw 'uninstall.ps1 reported failures' }
          cmd /c "schtasks /Query /TN handover-relay >nul 2>&1"
          if ($LASTEXITCODE -eq 0) { throw 'uninstall.ps1 left the logon task' }
          foreach ($p in $env:HANDOVER_INSTALL_DIR, $env:HANDOVER_HOME) { if (Test-Path $p) { throw "left behind: $p" } }
          # The last schtasks query above exits 1 (task gone, as expected); don't let it fail the step.
          exit 0
